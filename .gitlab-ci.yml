variables:
  AMI_ID: "ami-073130f74f5ffb161"
  KEY_NAME: "deploy"
  SECURITY_GROUP: "sg-0b16f68678d01775c"
  INSTANCE_TYPE: "t3.micro"
  STORAGE: 100

  # Nom complet d'image dans le registry GitLab :
  # (recommandé) utilise le registry du projet
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/static-website-example"

image: docker:24
services:
  - name: docker:24-dind
    alias: docker

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

stages:
  - build
  - Test acceptation
  - Release image
  - Deploy review
  - Stop review
  - Deploy staging
  - Test staging
  - Deploy prod
  - Test prod

# Template de test HTTP (staging/prod)
.test_template: &test
  image: alpine:3.20
  only:
    - master
  script:
    - apk --no-cache add curl
    # 1) Vérifie que le serveur répond
    - curl -fsS "http://$DOMAIN" >/tmp/page.html
    # 2) Vérifie que ça ressemble à de l'HTML (test robuste)
    - grep -Ei "<html|<!doctype html" /tmp/page.html


docker-build:
  stage: build
  script:
    - echo "Build Docker image..."
    - docker build -t static-website-example:ci .
    - echo "Save image as artifact..."
    - docker save static-website-example:ci > static-website-example.tar
  artifacts:
    paths:
      - static-website-example.tar


test acceptation:
  stage: Test acceptation
  script:
    - docker load < static-website-example.tar
    # Run nginx:80 (conteneur) -> 8080 (runner)
    - docker run -d -p 8080:80 --name webapp static-website-example:ci
    - sleep 2
    - apk --no-cache add curl
    # Test local dans le runner (localhost)
    - curl -fsS "http://localhost:8080" >/tmp/page.html
    - grep -Ei "<html|<!doctype html" /tmp/page.html
    - docker logs webapp || true
    - docker rm -f webapp


release image:
  stage: Release image
  only:
    - master
  script:
    - docker load < static-website-example.tar

    # Tagging : branche + short SHA (comme ton modèle)
    - docker tag static-website-example:ci "${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}"
    - docker tag static-website-example:ci "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"

    # Login GitLab registry + push
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push "${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}"
    - docker push "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"


deploy staging:
  stage: Deploy staging
  environment:
    name: staging
    url: http://${HOSTNAME_DEPLOY_STAGING}
  only:
    - master
  script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - touch ~/.ssh/known_hosts
    - echo "${SSH_KEY}" > ~/.ssh/id_rsa
    - chmod 0400 ~/.ssh/id_rsa
    - ssh-keyscan -t rsa ${HOSTNAME_DEPLOY_STAGING} >> ~/.ssh/known_hosts

    # Sur la machine staging : login registry, pull, run nginx en 80:80
    - command1="docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - command2="docker pull $IMAGE_NAME:$CI_COMMIT_REF_SLUG"
    - command3="docker rm -f webapp || true"
    - command4="docker run -d -p 80:80 --name webapp $IMAGE_NAME:$CI_COMMIT_REF_SLUG"

    - ssh -t ${SSH_USER}@${HOSTNAME_DEPLOY_STAGING} \
      -o SendEnv=IMAGE_NAME \
      -o SendEnv=CI_COMMIT_REF_SLUG \
      -o SendEnv=CI_REGISTRY_USER \
      -o SendEnv=CI_REGISTRY_PASSWORD \
      -o SendEnv=CI_REGISTRY \
      -C "$command1 && $command2 && $command3 && $command4"


deploy prod:
  stage: Deploy prod
  environment:
    name: prod
    url: http://${HOSTNAME_DEPLOY_PROD}
  only:
    - master
  script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - touch ~/.ssh/known_hosts
    - echo "${SSH_KEY}" > ~/.ssh/id_rsa
    - chmod 0400 ~/.ssh/id_rsa
    - ssh-keyscan -t rsa ${HOSTNAME_DEPLOY_PROD} >> ~/.ssh/known_hosts

    - command1="docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - command2="docker pull $IMAGE_NAME:$CI_COMMIT_REF_SLUG"
    - command3="docker rm -f webapp || true"
    - command4="docker run -d -p 80:80 --name webapp $IMAGE_NAME:$CI_COMMIT_REF_SLUG"

    - ssh -t ${SSH_USER}@${HOSTNAME_DEPLOY_PROD} \
      -o SendEnv=IMAGE_NAME \
      -o SendEnv=CI_COMMIT_REF_SLUG \
      -o SendEnv=CI_REGISTRY_USER \
      -o SendEnv=CI_REGISTRY_PASSWORD \
      -o SendEnv=CI_REGISTRY \
      -C "$command1 && $command2 && $command3 && $command4"


deploy review:
  stage: Deploy review
  only:
    - merge_requests
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: $REVIEW_ENVIRONMENT_URL
    on_stop: stop review
  script:
    - export INIT_PATH=$(pwd)

    - apk add --no-cache python3 py3-pip
    - python3 -m venv venv
    - . venv/bin/activate
    - pip install awscli

    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set region $AWS_DEFAULT_REGION

    - export BRANCH_NAME=$CI_COMMIT_REF_SLUG
    - export TAG="review-$BRANCH_NAME"

    - |
      INSTANCE_ID=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=$TAG" \
        --query "Reservations[*].Instances[*].InstanceId" \
        --output text)

    - |
      if [ -n "$INSTANCE_ID" ]; then
        echo "Instance déjà existante : $INSTANCE_ID"
      else
        USER_DATA="#!/bin/bash
        curl -fsSL https://get.docker.com -o install-docker.sh
        sh install-docker.sh --dry-run
        sudo sh install-docker.sh
        sudo usermod -aG docker ubuntu"

        aws ec2 run-instances \
          --image-id $AMI_ID \
          --count 1 \
          --instance-type $INSTANCE_TYPE \
          --key-name $KEY_NAME \
          --security-group-ids $SECURITY_GROUP \
          --block-device-mappings DeviceName=/dev/sda1,Ebs={VolumeSize=$STORAGE} \
          --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value='$TAG'}]' \
          --user-data "$USER_DATA"

        sleep 30
      fi

    - |
      PUBLIC_IP=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=$TAG" \
        --query "Reservations[*].Instances[*].PublicIpAddress" \
        --output text)

    - |
      if [ -z "$PUBLIC_IP" ]; then
        echo "Aucune IP publique trouvée pour $TAG"
        exit 1
      fi

    - export HOSTNAME_DEPLOY_REVIEW=$PUBLIC_IP
    - echo "IP review: $HOSTNAME_DEPLOY_REVIEW"

    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - touch ~/.ssh/known_hosts
    - echo "${SSH_KEY}" > ~/.ssh/id_rsa
    - chmod 0400 ~/.ssh/id_rsa
    - ssh-keyscan -t rsa ${HOSTNAME_DEPLOY_REVIEW} >> ~/.ssh/known_hosts

    - command1="docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - command2="docker pull $IMAGE_NAME:$CI_COMMIT_REF_SLUG"
    - command3="docker rm -f webapp || true"
    - command4="docker run -d -p 80:80 --name webapp $IMAGE_NAME:$CI_COMMIT_REF_SLUG"

    - ssh -t ${SSH_USER}@${HOSTNAME_DEPLOY_REVIEW} \
      -o SendEnv=IMAGE_NAME \
      -o SendEnv=CI_COMMIT_REF_SLUG \
      -o SendEnv=CI_REGISTRY_USER \
      -o SendEnv=CI_REGISTRY_PASSWORD \
      -o SendEnv=CI_REGISTRY \
      -C "$command1 && $command2 && $command3 && $command4"

    - cd $INIT_PATH
    - echo "REVIEW_ENVIRONMENT_URL=http://$HOSTNAME_DEPLOY_REVIEW" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env


stop review:
  stage: Stop review
  only:
    - merge_requests
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  when: manual
  script:
    - apk add --no-cache python3 py3-pip
    - python3 -m venv venv
    - . venv/bin/activate
    - pip install awscli

    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set region $AWS_DEFAULT_REGION

    - export BRANCH_NAME=$CI_COMMIT_REF_SLUG
    - export TAG="review-$BRANCH_NAME"
    - export NEW_TAG="destroyed-$BRANCH_NAME"

    - |
      INSTANCE_ID=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=$TAG" \
        --query "Reservations[*].Instances[*].InstanceId" \
        --output text)

    - |
      if [ -n "$INSTANCE_ID" ]; then
        aws ec2 create-tags --resources $INSTANCE_ID --tags Key=Name,Value=$NEW_TAG
        aws ec2 terminate-instances --instance-ids $INSTANCE_ID
        echo "Instance supprimée : $INSTANCE_ID"
      else
        echo "Aucune instance à supprimer."
      fi


test staging:
  <<: *test
  stage: Test staging
  variables:
    DOMAIN: ${HOSTNAME_DEPLOY_STAGING}


test prod:
  <<: *test
  stage: Test prod
  variables:
    DOMAIN: ${HOSTNAME_DEPLOY_PROD}