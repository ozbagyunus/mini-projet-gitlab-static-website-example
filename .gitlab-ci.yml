# ============================================================
#  GITLAB CI/CD - MINI PROJET DEVOPS
#  Objectif :
#   1) Build une image Docker d'un site statique
#   2) Tester localement l'image (dans le runner)
#   3) Publier l'image dans le GitLab Container Registry
#   4) Déployer :
#        - en "review app" sur une EC2 créée automatiquement (Merge Request)
#        - en staging (EC2 déjà existante)
#        - en prod (EC2 déjà existante)
# ============================================================

# -------------------------
# VARIABLES GLOBALES
# -------------------------
variables:
  # --- AWS (utilisé UNIQUEMENT pour les review apps) ---
  AMI_ID: "ami-073130f74f5ffb161"           # AMI Ubuntu
  KEY_NAME: "deploy"                       # KeyPair EC2 existante
  SECURITY_GROUP: "sg-0b16f68678d01775c"    # Security Group existant
  INSTANCE_TYPE: "t3.micro"
  STORAGE: 100

  # --- Docker-in-Docker (permet de lancer docker dans le job CI) ---
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# Image par défaut pour les jobs qui utilisent Docker (build, tests, push)
image: docker:24

# Service docker "dind" (Docker daemon dans un conteneur à côté)
services:
  - name: docker:24-dind
    alias: docker

# -------------------------
# LISTE DES STAGES
# (ordre d'exécution)
# -------------------------
stages:
  - build
  - test_acceptation
  - release_image
  - deploy_review
  - stop_review
  - deploy_staging
  - test_staging
  - deploy_prod
  - test_prod

# -------------------------
# TEMPLATE DE TEST HTTP
# (réutilisé pour staging et prod)
# -------------------------
.test_template: &http_test
  image: alpine:3.20
  only:
    - master
  script:
    - apk --no-cache add curl
    # On télécharge la page et on vérifie que c'est bien du HTML
    - curl -fsS "http://$DOMAIN" >/tmp/page.html
    - grep -Ei "<html|<!doctype html" /tmp/page.html

# ============================================================
# 1) BUILD : construire l'image Docker
# ============================================================
docker_build:
  stage: build
  only:
    - master
    - merge_requests
  script:
    # 1) Build de l'image
    - docker build -t static-website-example:ci .
    # 2) Sauvegarde de l'image dans un fichier TAR (artifact)
    - docker save static-website-example:ci > static-website-example.tar
  artifacts:
    # Ce fichier sera récupérable dans les jobs suivants
    paths:
      - static-website-example.tar
    expire_in: 1 hour

# ============================================================
# 2) TEST ACCEPTATION : lancer le conteneur et vérifier HTTP
# ============================================================
test_acceptation:
  stage: test_acceptation
  only:
    - master
    - merge_requests
  # IMPORTANT : on récupère l'artifact du build (le .tar)
  needs:
    - job: docker_build
      artifacts: true
  script:
    - |
      set -e

      # On recharge l'image depuis l'artifact
      docker load < static-website-example.tar

      # Réseau Docker dédié au test
      docker network create ci-net >/dev/null 2>&1 || true

      # On lance l'app dans un conteneur (dans le réseau ci-net)
      docker run -d --name webapp --network ci-net static-website-example:ci
      sleep 2

      # Test HTTP depuis un conteneur curl dans le même réseau
      docker run --rm --network ci-net curlimages/curl:8.7.1 -fsS http://webapp/ | grep -Ei "<html|<!doctype html"

      # Nettoyage
      docker rm -f webapp
      docker network rm ci-net >/dev/null 2>&1 || true

# ============================================================
# 3) RELEASE IMAGE : pousser l'image vers GitLab Registry
# ============================================================
release_image:
  stage: release_image
  only:
    - master
    - merge_requests
  # IMPORTANT : on récupère l'artifact du build (le .tar)
  needs:
    - job: docker_build
      artifacts: true
  script:
    - |
      set -e

      # On recharge l'image depuis l'artifact
      docker load < static-website-example.tar

      # On tag l'image avec :
      # - le nom de la branche (ex: master, feature-x)
      # - le SHA court (tag immuable)
      docker tag static-website-example:ci "${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}"
      docker tag static-website-example:ci "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"

      # Login au registry GitLab
      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

      # Push des tags
      docker push "${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}"
      docker push "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"

# ============================================================
# 4) DEPLOY REVIEW (Merge Request) : création EC2 + déploiement
# ============================================================
deploy_review:
  stage: deploy_review
  image: alpine:3.20
  only:
    - merge_requests
  environment:
    # GitLab va créer un environnement par branche de MR
    name: review/$CI_COMMIT_REF_SLUG
    # L'URL est générée dynamiquement grâce au fichier deploy.env
    url: $REVIEW_ENVIRONMENT_URL
    # Quand on clique "Stop", GitLab lance le job stop_review
    on_stop: stop_review
  script:
    # Installation des outils nécessaires :
    # - awscli (pour créer/chercher/terminer l'instance EC2)
    # - openssh-client (pour se connecter à la VM)
    - apk add --no-cache python3 py3-pip openssh-client
    - pip install --no-cache-dir awscli

    # Configuration AWS via variables GitLab (déjà présentes chez toi)
    - aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
    - aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
    - aws configure set region "$AWS_DEFAULT_REGION"

    # Tag unique pour l'instance review (ex: review-feature-login)
    - export TAG="review-$CI_COMMIT_REF_SLUG"

    # 1) Vérifier si une instance existe déjà
    - |
      INSTANCE_ID=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=$TAG" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
        --query "Reservations[*].Instances[*].InstanceId" \
        --output text)

      if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
        echo "Instance déjà existante : $INSTANCE_ID"
      else
        echo "Création d'une EC2 pour l'environnement review : $TAG"

        # Script exécuté automatiquement au démarrage de la VM :
        # => installe Docker
        USER_DATA="#!/bin/bash
        curl -fsSL https://get.docker.com -o install-docker.sh
        sh install-docker.sh --dry-run
        sudo sh install-docker.sh
        sudo usermod -aG docker ubuntu
        "

        aws ec2 run-instances \
          --image-id "$AMI_ID" \
          --count 1 \
          --instance-type "$INSTANCE_TYPE" \
          --key-name "$KEY_NAME" \
          --security-group-ids "$SECURITY_GROUP" \
          --block-device-mappings DeviceName=/dev/sda1,Ebs={VolumeSize=$STORAGE} \
          --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=$TAG}]" \
          --user-data "$USER_DATA"

        # Attente simple pour laisser le temps à l'EC2 de démarrer et d'installer Docker
        sleep 60
      fi

    # 2) Récupérer l'IP publique
    - |
      PUBLIC_IP=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=$TAG" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
        --query "Reservations[*].Instances[*].PublicIpAddress" \
        --output text)

      if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
        echo "IP publique introuvable"
        exit 1
      fi

      export HOSTNAME_DEPLOY_REVIEW="$PUBLIC_IP"
      echo "IP review : $HOSTNAME_DEPLOY_REVIEW"

    # 3) Préparer SSH
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "${SSH_KEY}" > ~/.ssh/id_rsa
    - chmod 400 ~/.ssh/id_rsa
    - ssh-keyscan -t rsa "${HOSTNAME_DEPLOY_REVIEW}" >> ~/.ssh/known_hosts

    # 4) Déployer le conteneur sur la VM review :
    # - login registry
    # - pull l'image
    # - run sur le port 80
    - |
      ssh -t ${SSH_USER}@${HOSTNAME_DEPLOY_REVIEW} "
        docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY} &&
        docker pull ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG} &&
        docker rm -f webapp || true &&
        docker run -d --restart unless-stopped -p 80:80 --name webapp ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}
      "

    # 5) Exporter l'URL pour GitLab (environnement)
    - echo "REVIEW_ENVIRONMENT_URL=http://${HOSTNAME_DEPLOY_REVIEW}" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env

# ============================================================
# 5) STOP REVIEW : job manuel pour supprimer l'EC2 review
# ============================================================
stop_review:
  stage: stop_review
  image: alpine:3.20
  only:
    - merge_requests
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  when: manual
  script:
    - apk add --no-cache python3 py3-pip
    - pip install --no-cache-dir awscli

    - aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
    - aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
    - aws configure set region "$AWS_DEFAULT_REGION"

    - export TAG="review-$CI_COMMIT_REF_SLUG"
    - export NEW_TAG="destroyed-$CI_COMMIT_REF_SLUG"

    - |
      INSTANCE_ID=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=$TAG" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
        --query "Reservations[*].Instances[*].InstanceId" \
        --output text)

      if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
        echo "Suppression instance : $INSTANCE_ID"
        aws ec2 create-tags --resources "$INSTANCE_ID" --tags Key=Name,Value="$NEW_TAG"
        aws ec2 terminate-instances --instance-ids "$INSTANCE_ID"
      else
        echo "Aucune instance review à supprimer."
      fi

# ============================================================
# 6) DEPLOY STAGING : déploiement sur EC2 existante
# ============================================================
deploy_staging:
  stage: deploy_staging
  only:
    - master
  environment:
    name: staging
    url: http://${HOSTNAME_DEPLOY_STAGING}
  script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "${SSH_KEY}" > ~/.ssh/id_rsa
    - chmod 400 ~/.ssh/id_rsa
    - ssh-keyscan -t rsa "${HOSTNAME_DEPLOY_STAGING}" >> ~/.ssh/known_hosts

    - |
      ssh -t "${SSH_USER}@${HOSTNAME_DEPLOY_STAGING}" "
        docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY} &&
        docker pull ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG} &&
        docker rm -f webapp || true &&
        docker run -d -p 80:80 --name webapp ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}
      "

# Test staging (réutilise le template)
test_staging:
  <<: *http_test
  stage: test_staging
  variables:
    DOMAIN: ${HOSTNAME_DEPLOY_STAGING}

# ============================================================
# 7) DEPLOY PROD : déploiement sur EC2 existante
# ============================================================
deploy_prod:
  stage: deploy_prod
  only:
    - master
  environment:
    name: prod
    url: http://${HOSTNAME_DEPLOY_PROD}
  script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "${SSH_KEY}" > ~/.ssh/id_rsa
    - chmod 400 ~/.ssh/id_rsa
    - ssh-keyscan -t rsa "${HOSTNAME_DEPLOY_PROD}" >> ~/.ssh/known_hosts

    - |
      ssh -t "${SSH_USER}@${HOSTNAME_DEPLOY_PROD}" "
        docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY} &&
        docker pull ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG} &&
        docker rm -f webapp || true &&
        docker run -d -p 80:80 --name webapp ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}
      "

# Test prod (réutilise le template)
test_prod:
  <<: *http_test
  stage: test_prod
  variables:
    DOMAIN: ${HOSTNAME_DEPLOY_PROD}
