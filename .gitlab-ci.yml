variables:
  AMI_ID: "ami-073130f74f5ffb161"
  KEY_NAME: "deploy"
  SECURITY_GROUP: "sg-0b16f68678d01775c"
  INSTANCE_TYPE: "t3.micro"
  STORAGE: 100
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

image: docker:24

services:
  - name: docker:24-dind
    alias: docker

stages:
  - build
  - test_acceptation
  - release_image
  - deploy_review
  - stop_review
  - deploy_staging
  - test_staging
  - deploy_prod
  - test_prod

.test_template: &http_test
  image: alpine:3.20
  only:
    - master
  script:
    - apk --no-cache add curl
    - curl -fsS "http://$DOMAIN" >/tmp/page.html
    - grep -Ei "<html|<!doctype html" /tmp/page.html


# -------------------------
# BUILD
# -------------------------
docker_build:
  stage: build
  only:
    - master
    - merge_requests
  script:
    - docker build -t static-website-example:ci .
    - docker save static-website-example:ci > static-website-example.tar
  artifacts:
    paths:
      - static-website-example.tar
    expire_in: 1 hour

# -------------------------
# TEST ACCEPTATION (robuste en dind)
# -------------------------
test_acceptation:
  stage: test_acceptation
  script:
    - |
      set -e
      docker load < static-website-example.tar

      docker network create ci-net >/dev/null 2>&1 || true
      docker run -d --name webapp --network ci-net static-website-example:ci
      sleep 2

      docker ps -a
      docker logs webapp || true

      # Test HTTP depuis un conteneur curl dans le même réseau
      docker run --rm --network ci-net curlimages/curl:8.7.1 -fsS http://webapp/ | grep -Ei "<html|<!doctype html"

      docker rm -f webapp
      docker network rm ci-net >/dev/null 2>&1 || true

# -------------------------
# RELEASE IMAGE -> GitLab Registry
# IMAGE_NAME vient de tes variables GitLab
# -------------------------
release_image:
  stage: release_image
  only:
    - master
    - merge_requests
  script:
    - |
      set -e
      docker load < static-website-example.tar

      docker tag static-website-example:ci "${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}"
      docker tag static-website-example:ci "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"

      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      docker push "${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}"
      docker push "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"

# -------------------------
# DEPLOY REVIEW (Merge Requests)
# Crée une EC2 taguée review-<branch> si elle n’existe pas, récupère son IP, déploie le conteneur
# Expose l'URL via dotenv artifact REVIEW_ENVIRONMENT_URL
# -------------------------
deploy_review:
  image: alpine:3.20
  stage: deploy_review
  only:
    - merge_requests
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: $REVIEW_ENVIRONMENT_URL
    on_stop: stop_review
  script:
    - export INIT_PATH=$(pwd)

    # AWS CLI
    - apk add --no-cache python3 py3-pip
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install --no-cache-dir awscli

    # Configure AWS (vars already exist)
    - aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
    - aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
    - aws configure set region "$AWS_DEFAULT_REGION"

    - export BRANCH_NAME="$CI_COMMIT_REF_SLUG"
    - export TAG="review-$BRANCH_NAME"

    # Check if instance already exists
    - |
      INSTANCE_ID=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=$TAG" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
        --query "Reservations[*].Instances[*].InstanceId" \
        --output text)

      if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
        echo "Instance déjà existante avec tag '$TAG' : $INSTANCE_ID"
      else
        echo "Création d'une instance EC2 pour '$TAG'..."

        USER_DATA="#!/bin/bash
        curl -fsSL https://get.docker.com -o install-docker.sh
        sh install-docker.sh --dry-run
        sudo sh install-docker.sh
        sudo usermod -aG docker ubuntu
        "

        aws ec2 run-instances \
          --image-id "$AMI_ID" \
          --count 1 \
          --instance-type "$INSTANCE_TYPE" \
          --key-name "$KEY_NAME" \
          --security-group-ids "$SECURITY_GROUP" \
          --block-device-mappings DeviceName=/dev/sda1,Ebs={VolumeSize=$STORAGE} \
          --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=$TAG}]" \
          --user-data "$USER_DATA"

        echo "Attente provisioning EC2..."
        sleep 60
      fi

    # Get public IP
    - |
      PUBLIC_IP=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=$TAG" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
        --query "Reservations[*].Instances[*].PublicIpAddress" \
        --output text)

      if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
        echo "IP publique introuvable pour tag '$TAG'."
        exit 1
      fi

      export HOSTNAME_DEPLOY_REVIEW="$PUBLIC_IP"
      echo "IP review: $HOSTNAME_DEPLOY_REVIEW"

    # SSH + deploy container
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "${SSH_KEY}" > ~/.ssh/id_rsa
    - chmod 400 ~/.ssh/id_rsa
    - ssh-keyscan -t rsa "${HOSTNAME_DEPLOY_REVIEW}" >> ~/.ssh/known_hosts

    - |
      ssh -t ${SSH_USER}@${HOSTNAME_DEPLOY_REVIEW} "
        docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY} &&
        docker pull ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG} &&
        docker rm -f webapp || true &&
        docker run -d --restart unless-stopped -p 80:80 --name webapp ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}
      "

    # Export URL for GitLab environment
    - cd "$INIT_PATH"
    - echo "REVIEW_ENVIRONMENT_URL=http://${HOSTNAME_DEPLOY_REVIEW}" >> deploy.env

  artifacts:
    reports:
      dotenv: deploy.env

# -------------------------
# STOP REVIEW (manual)
# Termine l’EC2 taguée review-<branch>
# -------------------------
stop_review:
  image: alpine:3.20
  stage: stop_review
  only:
    - merge_requests
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  when: manual
  script:
    - apk add --no-cache python3 py3-pip
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install --no-cache-dir awscli

    - aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
    - aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
    - aws configure set region "$AWS_DEFAULT_REGION"

    - export BRANCH_NAME="$CI_COMMIT_REF_SLUG"
    - export TAG="review-$BRANCH_NAME"
    - export NEW_TAG="destroyed-$BRANCH_NAME"

    - |
      INSTANCE_ID=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=$TAG" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
        --query "Reservations[*].Instances[*].InstanceId" \
        --output text)

      if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
        echo "Suppression instance $INSTANCE_ID (tag: $TAG)"

        aws ec2 create-tags --resources "$INSTANCE_ID" --tags Key=Name,Value="$NEW_TAG"
        aws ec2 terminate-instances --instance-ids "$INSTANCE_ID"

        echo "Instance terminée."
      else
        echo "Aucune instance trouvée avec tag '$TAG'."
      fi

# -------------------------
# DEPLOY STAGING
# -------------------------
deploy_staging:
  stage: deploy_staging
  only:
    - master
  environment:
    name: staging
    url: http://${HOSTNAME_DEPLOY_STAGING}
  script:
    - |
      set -e
      apk add --no-cache openssh-client

      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      echo "${SSH_KEY}" > ~/.ssh/id_rsa
      chmod 400 ~/.ssh/id_rsa
      ssh-keyscan -t rsa "${HOSTNAME_DEPLOY_STAGING}" >> ~/.ssh/known_hosts

      ssh -t "${SSH_USER}@${HOSTNAME_DEPLOY_STAGING}" "
        docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY} &&
        docker pull ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG} &&
        docker rm -f webapp || true &&
        docker run -d -p 80:80 --name webapp ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}
      "

test_staging:
  <<: *http_test
  stage: test_staging
  variables:
    DOMAIN: ${HOSTNAME_DEPLOY_STAGING}

# -------------------------
# DEPLOY PROD
# -------------------------
deploy_prod:
  stage: deploy_prod
  only:
    - master
  environment:
    name: prod
    url: http://${HOSTNAME_DEPLOY_PROD}
  script:
    - |
      set -e
      apk add --no-cache openssh-client

      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      echo "${SSH_KEY}" > ~/.ssh/id_rsa
      chmod 400 ~/.ssh/id_rsa
      ssh-keyscan -t rsa "${HOSTNAME_DEPLOY_PROD}" >> ~/.ssh/known_hosts

      ssh -t "${SSH_USER}@${HOSTNAME_DEPLOY_PROD}" "
        docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY} &&
        docker pull ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG} &&
        docker rm -f webapp || true &&
        docker run -d -p 80:80 --name webapp ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}
      "

test_prod:
  <<: *http_test
  stage: test_prod
  variables:
    DOMAIN: ${HOSTNAME_DEPLOY_PROD}