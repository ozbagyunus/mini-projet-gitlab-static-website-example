# VARIABLES GLOBALES
variables:
  # AMI Ubuntu à utiliser pour créer l'EC2 "review"
  AMI_ID: "ami-073130f74f5ffb161"
  # Nom de la KeyPair EC2 présent sur AWS
  KEY_NAME: "deploy"
  # Security Group EC2
  SECURITY_GROUP: "sg-0b16f68678d01775c"
  # Type d'instance EC2
  INSTANCE_TYPE: "t3.micro"
  # Taille du disque de l'EC2
  STORAGE: 100

  # Docker-in-Docker (permet de lancer docker dans le job CI)
  # Le client Docker de l'image docker:24 parle au daemon docker:dind via TCP
  DOCKER_HOST: tcp://docker:2375
  # Pas de TLS entre le client docker et dind apparement c'est une configuration classique CI
  DOCKER_TLS_CERTDIR: ""

# Image par défaut (utile pour build/test/push Docker)
image: docker:24

# Service Docker "dind" : daemon docker dans un conteneur séparé
services:
  - name: docker:24-dind
    alias: docker

# STAGES (ordre d'exécution)
stages:
  - build
  - test_acceptation
  - release_image
  - deploy_review
  - stop_review
  - deploy_staging
  - test_staging
  - deploy_prod
  - test_prod


# TEMPLATE DE TEST HTTP
# Ce test :
#   - installe curl
#   - fait un curl sur l'URL
#   - vérifie qu'on reçoit bien du HTML
.test_template: &http_test
  image: alpine:3.20
  only:
    - master
  script:
    - apk --no-cache add curl
    # On télécharge la page dans /tmp/page.html
    - curl -fsS "http://$DOMAIN" >/tmp/page.html
    # On vérifie qu'il y a au moins une balise HTML
    - grep -Ei "<html|<!doctype html" /tmp/page.html

# 1) BUILD : construire l'image Docker
docker_build:
  stage: build
  only:
    - master
    - merge_requests
  script:
    # Construire l'image Docker
    - docker build -t static-website-example:ci .
    # Sauvegarder l'image dans un fichier .tar
    # => permet de la réutiliser dans les jobs suivants sans rebuild
    - docker save static-website-example:ci > static-website-example.tar
  artifacts:
    # Artifact = fichier partagé entre jobs GitLab
    paths:
      - static-website-example.tar
    expire_in: 1 hour


# 2) TEST ACCEPTATION : vérifier que l'image marche (HTTP OK)
test_acceptation:
  stage: test_acceptation
  only:
    - master
    - merge_requests

  # "needs" sert à 2 choses :
  #   - dire à GitLab que ce job dépend de docker_build
  #   - récupérer l'artifact static-website-example.tar (sinon il peut manquer)
  needs:
    - job: docker_build
      artifacts: true

  script:
    - |
      set -e
      # Charger l'image depuis l'artifact
      docker load < static-website-example.tar

      # Créer un réseau docker dédié au test
      docker network create ci-net >/dev/null 2>&1 || true

      # Lancer le conteneur à tester (dans le réseau ci-net)
      docker run -d --name webapp --network ci-net static-website-example:ci
      sleep 2

      # Test HTTP depuis un conteneur curl dans le même réseau
      docker run --rm --network ci-net curlimages/curl:8.7.1 -fsS http://webapp/ | grep -Ei "<html|<!doctype html"

      # Nettoyage
      docker rm -f webapp
      docker network rm ci-net >/dev/null 2>&1 || true


# 3) RELEASE : pousser l'image dans GitLab Container Registry
release_image:
  stage: release_image
  only:
    - master
    - merge_requests

  # On récupère l'artifact du build (le .tar)
  needs:
    - job: docker_build
      artifacts: true

  script:
    - |
      set -e
      # Charger l'image depuis l'artifact
      docker load < static-website-example.tar

      # Tagging :
      #    - CI_COMMIT_REF_SLUG = nom de branche "compatible"
      #    - CI_COMMIT_SHORT_SHA = tag immuable (lié au commit)
      docker tag static-website-example:ci "${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}"
      docker tag static-website-example:ci "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"

      # Login au registry GitLab (credentials fournis par GitLab)
      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

      # Push des deux tags
      docker push "${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}"
      docker push "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"


# 4) DEPLOY REVIEW (Merge Request) : création EC2 + déploiement
# Idée générale :
#   - Quand on ouvre une Merge Request, GitLab exécute ce job.
#   - Ce job crée une EC2 dédiée à la branche (si elle n'existe pas déjà).
#   - Ensuite il déploie le conteneur sur cette EC2.
#   - Enfin il donne à GitLab une URL (REVIEW_ENVIRONMENT_URL) pour afficher
#     un bouton "View app" sur la MR.
deploy_review:
  stage: deploy_review
  image: alpine:3.20
  only:
    - merge_requests

  environment:
    # Environnement dynamique :
    # review/ma-branche, review/feature-x, etc.
    name: review/$CI_COMMIT_REF_SLUG

    # L'URL affichée par GitLab pour cet environnement
    # (elle sera injectée via le fichier deploy.env)
    url: $REVIEW_ENVIRONMENT_URL

    # Quand on clique "Stop environment" dans GitLab,
    # GitLab lance le job "stop_review"
    on_stop: stop_review

  script:
    - set -e


    # Préparer les outils nécessaires dans le job
    # aws-cli pour créer/chercher/terminer l'EC2
    # openssh-client pour se connecter à l'EC2 et exécuter des commandes docker à distance
    - apk add --no-cache aws-cli openssh-client

    # Configuration AWS
    # Ici on configure aws-cli en utilisant les variables GitLab :
    # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_DEFAULT_REGION
    # Ces variables sont à définir dans GitLab CI/CD Settings > Variables
    - aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
    - aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
    - aws configure set region "$AWS_DEFAULT_REGION"

    # Définir un "tag" unique pour identifier l'EC2
    # Exemple :
    #   branche = feature-login
    #   tag Name = review-feature-login
    #   si le job se relance, il peut retrouver l'EC2 au lieu d'en recréer une nouvelle
    - export TAG="review-$CI_COMMIT_REF_SLUG"


    # Étape 1 : vérifier si l'EC2 existe déjà
    # On récupère l'InstanceId si trouvée
    - |
      INSTANCE_ID=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=$TAG" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
        --query "Reservations[*].Instances[*].InstanceId" \
        --output text)

      # Si INSTANCE_ID n'est pas vide, alors l'instance existe déjà
      if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
        echo "Instance review déjà existante : $INSTANCE_ID"
      else
        echo "Aucune instance trouvée, création d'une EC2 : $TAG"

        # E) User Data : script exécuté automatiquement au boot
        # Ce script s'exécute quand l'EC2 démarre.
        # Ici il sert à :
        #   - installer Docker
        #   - ajouter l'utilisateur ubuntu au groupe docker
        #   -> pour pouvoir ensuite faire "docker pull / docker run" via SSH
        USER_DATA="#!/bin/bash
        curl -fsSL https://get.docker.com -o install-docker.sh
        sh install-docker.sh --dry-run
        sudo sh install-docker.sh
        sudo usermod -aG docker ubuntu
        "

        # F) Création de l'EC2
        # On utilise :
        #   - AMI_ID / INSTANCE_TYPE / KEY_NAME / SECURITY_GROUP / STORAGE
        # Et on tag l'instance avec Name=$TAG
        aws ec2 run-instances \
          --image-id "$AMI_ID" \
          --count 1 \
          --instance-type "$INSTANCE_TYPE" \
          --key-name "$KEY_NAME" \
          --security-group-ids "$SECURITY_GROUP" \
          --block-device-mappings DeviceName=/dev/sda1,Ebs={VolumeSize=$STORAGE} \
          --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=$TAG}]" \
          --user-data "$USER_DATA"


        # G) Attente simple
        # On attend que l'EC2 ait le temps :
        #   - de démarrer
        #   - d'obtenir une IP publique
        #   - d'exécuter le user-data (installer Docker)
        sleep 60
      fi


    # H) Étape 2 : récupérer l'IP publique de l'EC2
    # On re-fait un describe-instances mais cette fois on récupère PublicIpAddress
    - |
      PUBLIC_IP=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=$TAG" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
        --query "Reservations[*].Instances[*].PublicIpAddress" \
        --output text)

      # Si pas d'IP => on arrête le job
      if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
        echo "IP publique introuvable (l'instance n'est peut-être pas prête)."
        exit 1
      fi

      # On stocke l'IP dans une variable pour la suite
      export HOSTNAME_DEPLOY_REVIEW="$PUBLIC_IP"
      echo "IP review : $HOSTNAME_DEPLOY_REVIEW"


    # I) Étape 3 : préparer la connexion SSH vers l'EC2
    # On met la clé privée SSH (SSH_KEY) dans ~/.ssh/id_rsa
    # Puis on ajoute la clé de l'host dans known_hosts (évite le prompt interactif)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "${SSH_KEY}" > ~/.ssh/id_rsa
    - chmod 400 ~/.ssh/id_rsa
    - ssh-keyscan -t rsa "${HOSTNAME_DEPLOY_REVIEW}" >> ~/.ssh/known_hosts

    # J) Étape 4 : déployer le conteneur Docker sur l'EC2 via SSH
    # On exécute plusieurs commandes sur la VM :
    #   1) docker login au registry GitLab
    #   2) docker pull de l'image correspondant à la branche
    #   3) suppression de l'ancien conteneur (si existe)
    #   4) docker run sur le port 80 (site statique)
    - |
      ssh -t ${SSH_USER}@${HOSTNAME_DEPLOY_REVIEW} "
        docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY} &&
        docker pull ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG} &&
        docker rm -f webapp || true &&
        docker run -d --restart unless-stopped -p 80:80 --name webapp ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}
      "


    # K) Étape 5 : donner l'URL à GitLab pour afficher la Review App
    # On écrit une variable dans deploy.env.
    # GitLab la lit grâce à "artifacts:reports:dotenv"
    # => GitLab sait alors que l'URL de l'environnement est :
    #    http://<ip_publique>
    - echo "REVIEW_ENVIRONMENT_URL=http://${HOSTNAME_DEPLOY_REVIEW}" >> deploy.env

  artifacts:
    # Dotenv : GitLab charge les variables définies dans deploy.env
    # Ici : REVIEW_ENVIRONMENT_URL
    reports:
      dotenv: deploy.env


# 5) STOP REVIEW : job manuel pour supprimer l'EC2 review
#   - Quand on clique "Stop environment" dans GitLab,
#   - Il retrouve l'instance EC2 via le même tag Name=review-<branche>
#   - Puis la termine (terminate-instances)
stop_review:
  stage: stop_review
  image: alpine:3.20
  only:
    - merge_requests
  environment:
    # Il faut le même nom que deploy_review
    name: review/$CI_COMMIT_REF_SLUG
    # Indique à GitLab : ce job STOP l'environnement
    action: stop
  # Manuel : on choisit quand supprimer l'EC2 (pour pouvoir tester)
  when: manual
  script:
    - set -e
    - apk add --no-cache aws-cli

    # Configuration AWS
    - aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
    - aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
    - aws configure set region "$AWS_DEFAULT_REGION"

    # Tag de l'instance à supprimer
    - export TAG="review-$CI_COMMIT_REF_SLUG"
    # Nouveau tag juste pour "tracer" la suppression
    - export NEW_TAG="destroyed-$CI_COMMIT_REF_SLUG"

    # On retrouve l'instance par tag
    - |
      INSTANCE_ID=$(aws ec2 describe-instances \
        --filters "Name=tag:Name,Values=$TAG" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
        --query "Reservations[*].Instances[*].InstanceId" \
        --output text)

      if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
        echo "Suppression instance : $INSTANCE_ID"

        # On change le tag Name pour garder une trace
        aws ec2 create-tags --resources "$INSTANCE_ID" --tags Key=Name,Value="$NEW_TAG"

        # Terminate : supprime l'instance EC2
        aws ec2 terminate-instances --instance-ids "$INSTANCE_ID"
      else
        echo "ℹAucune instance review à supprimer."
      fi


# 6) DEPLOY STAGING : déploiement sur EC2 existante
deploy_staging:
  stage: deploy_staging
  only:
    - master
  environment:
    name: staging
    url: http://${HOSTNAME_DEPLOY_STAGING}
  script:
    - set -e
    - apk add --no-cache openssh-client

    # Préparation SSH (clé + known_hosts)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "${SSH_KEY}" > ~/.ssh/id_rsa
    - chmod 400 ~/.ssh/id_rsa
    - ssh-keyscan -t rsa "${HOSTNAME_DEPLOY_STAGING}" >> ~/.ssh/known_hosts

    # Déploiement via SSH (mêmes commandes que review, mais sur staging)
    - |
      ssh -t "${SSH_USER}@${HOSTNAME_DEPLOY_STAGING}" "
        docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY} &&
        docker pull ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG} &&
        docker rm -f webapp || true &&
        docker run -d -p 80:80 --name webapp ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}
      "

# Test staging (on réutilise le template)
test_staging:
  <<: *http_test
  stage: test_staging
  variables:
    DOMAIN: ${HOSTNAME_DEPLOY_STAGING}

# 7) DEPLOY PROD : déploiement sur EC2 existante
deploy_prod:
  stage: deploy_prod
  only:
    - master
  environment:
    name: prod
    url: http://${HOSTNAME_DEPLOY_PROD}
  script:
    - set -e
    - apk add --no-cache openssh-client

    # Préparation SSH (clé + known_hosts)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "${SSH_KEY}" > ~/.ssh/id_rsa
    - chmod 400 ~/.ssh/id_rsa
    - ssh-keyscan -t rsa "${HOSTNAME_DEPLOY_PROD}" >> ~/.ssh/known_hosts

    # Déploiement via SSH sur prod
    - |
      ssh -t "${SSH_USER}@${HOSTNAME_DEPLOY_PROD}" "
        docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY} &&
        docker pull ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG} &&
        docker rm -f webapp || true &&
        docker run -d -p 80:80 --name webapp ${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}
      "

# Test prod (on réutilise le template)
test_prod:
  <<: *http_test
  stage: test_prod
  variables:
    DOMAIN: ${HOSTNAME_DEPLOY_PROD}
